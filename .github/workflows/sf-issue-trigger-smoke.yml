name: SF GitHub Issue Trigger Smoke Test
on:
  issues:
    types: [opened]
permissions:
  contents: read
  issues: write
jobs:
  acknowledge:
    if: startsWith(github.event.issue.title, '[SF-GH-SMOKE]')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Acknowledge event without external network or secrets
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "SF-GH-SMOKE ACK: GitHub Actions received this issue event. No SMD, Cloudflare or market data requests were made."
